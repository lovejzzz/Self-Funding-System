name: Design system regression

on:
  pull_request:
    paths:
      - '*.html'
      - 'shared/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/design-system-regression.yml'
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'shared/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/design-system-regression.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:design
